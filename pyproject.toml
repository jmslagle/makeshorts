[project]
name = "makeshorts"
version = "0.1.0"
description = "Turn long-form webinar recordings into short vertical clips for social."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pillow>=10.3",
    "faster-whisper>=1.0",
    "numpy>=1.26",
]

[project.scripts]
ms = "makeshorts.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["makeshorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
